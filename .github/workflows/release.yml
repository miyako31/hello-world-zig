name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # General-purpose operating systems supported by Zig.
        os:
          - linux
          - windows
          - macos
          - freebsd
          - netbsd
          - openbsd
          - dragonfly
          - illumos
          - solaris
          - haiku
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build all architectures
        run: scripts/build-os.sh "${{ matrix.os }}" dist

      - name: Smoke test (x86_64-linux)
        if: matrix.os == 'linux'
        run: ./dist/hello-x86_64-linux

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: hello-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum hello-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hello-*
            dist/SHA256SUMS
          generate_release_notes: true
